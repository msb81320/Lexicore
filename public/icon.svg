<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle repetition orbit ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-dasharray="16 12" />

  <!-- Orbit nodes -->
  <circle cx="256" cy="80" r="12" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="432" cy="256" r="9" fill="#818cf8" />
  <circle cx="256" cy="432" r="11" fill="#a855f7" />
  <circle cx="80" cy="256" r="9" fill="#38bdf8" />

  <!-- Center Core: Geometric Open Book & Brain/Spaced Spark -->
  <g transform="translate(136, 146)">
    <!-- Book wings -->
    <!-- Left page -->
    <path d="M 120 180 C 70 170 20 180 0 190 L 0 50 C 25 40 75 30 120 45 Z" fill="url(#accentGrad)" opacity="0.9" />
    <!-- Right page -->
    <path d="M 120 180 C 170 170 220 180 240 190 L 240 50 C 215 40 165 30 120 45 Z" fill="url(#accentGrad)" opacity="0.9" />
    <!-- Center spine spine glow -->
    <line x1="120" y1="42" x2="120" y2="182" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    
    <!-- Rising recall spark / infinite loop -->
    <path d="M 80 100 C 80 70 100 65 120 80 C 140 65 160 70 160 100 C 160 130 120 150 120 150 C 120 150 80 130 80 100 Z" fill="#ffffff" filter="url(#glow)" opacity="0.95" />
    <circle cx="120" cy="98" r="8" fill="#6366f1" />
  </g>

  <!-- Typography Accent "L" and "X" dots -->
  <text x="256" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#94a3b8" letter-spacing="6" text-anchor="middle">LEXICORE</text>
</svg>
