<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var winDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (winDesc && winDesc.configurable && !winDesc.writable && !winDesc.set) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (val) {
                currentFetch = val;
              }
            });
          }
          var protoDesc = typeof Window !== 'undefined' && Window.prototype
            ? Object.getOwnPropertyDescriptor(Window.prototype, 'fetch')
            : undefined;
          if (protoDesc && protoDesc.configurable && !protoDesc.writable && !protoDesc.set) {
            Object.defineProperty(Window.prototype, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (val) {
                currentFetch = val;
              }
            });
          }
        } catch (_e) {}

        window.addEventListener(
          'error',
          function (event) {
            if (
              (event.filename && event.filename.indexOf('chrome-extension://') === 0) ||
              (event.message && event.message.indexOf('Cannot set property fetch of #<Window>') !== -1)
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
